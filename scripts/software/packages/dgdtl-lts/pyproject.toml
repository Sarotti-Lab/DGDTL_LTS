[build-system]
requires = [
    "setuptools==82.0.1",
    "wheel==0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "dgdtl-lts"
version = "1.0.0"
description = "Deterministic DGDTL-LTS regression engine"
readme = "README.md"
requires-python = "==3.12.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "José A. Pérez", email = "jandrespmen@gmail.com"},
]
dependencies = [
    "numpy==2.4.2",
    "pandas==3.0.1",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["dgdtl_core"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dgdtl_lts"]
